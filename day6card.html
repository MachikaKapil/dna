<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id-Card</title>
    <style>
        *{
            margin: 0;
        }
        .idcard {
            background-color: #e09b9b;
            width: 300px;
            height: 400px;
            /* border: 1px solid #ccc; */
            border-radius: 20px;
            box-shadow: 0 2px 4px black;
            margin: 20px;
            padding: 10px;
        }

        .card-body {
            padding: 10px;
        }

        .image{
            width: 60%;
            height: 40%;
            border-radius: 50%;
            margin-left: 20%;
        }
        
        .card-list {
            padding: 0;
            margin: 100px 0px 0px 0px;
            
        }

    
    </style>
</head>
<body>
    <div class="idcard">
        <div class="card-body">
          <img src="https://media.easy-peasy.ai/a5456f19-6298-4f50-a9e4-f8b87be5f165/afd380e2-284e-4231-85c1-f8c68bf9197f_medium.webp" class="image"/>

          <h3 style="text-align: center;">Kapil Machika</h3>
          <div style="text-align: left;">
            <ul type="none" class="card-list">
                <li>Software Engineer Trainee</li>
                <li>AJA Consulting services</li>
                <li>Employee ID: 2631038</li>
                <li>Contact: 9177094891</li>
            </ul>
          </div>
        </div>
    </div>    
</body>
</html>
